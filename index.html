<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="待办事项">
<meta name="theme-color" content="#4f46e5">
<meta name="description" content="简洁高效的待办事项管理工具">
<title>📋 待办事项</title>
<style>
  :root {
    --bg: #f0f2f5;
    --card-bg: #ffffff;
    --text: #1a1a2e;
    --text-secondary: #6b7280;
    --border: #e5e7eb;
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --danger: #ef4444;
    --success: #10b981;
    --radius: 12px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
  }

  .topbar {
    background: var(--primary);
    color: #fff;
    padding: 16px 20px;
    padding-top: max(16px, env(safe-area-inset-top));
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .topbar h1 { font-size: 1.3rem; font-weight: 700; flex: 1; }
  .topbar .date { font-size: .8rem; opacity: .85; }

  .main-scroll {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 16px;
    padding-bottom: calc(16px + var(--safe-bottom));
  }

  .app { max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

  .stats { display: flex; gap: 10px; justify-content: center; }
  .stat-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 14px 22px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
    text-align: center;
    min-width: 70px;
    flex: 1;
  }
  .stat-card .num { font-size: 1.5rem; font-weight: 700; color: var(--primary); }
  .stat-card .label { font-size: .72rem; color: var(--text-secondary); }

  .input-wrap { display: flex; gap: 8px; }
  .input-wrap input {
    flex: 1; padding: 14px 16px; border: 2px solid var(--border);
    border-radius: var(--radius); font-size: 1rem; outline: none;
    background: var(--card-bg); color: var(--text); transition: border-color .2s;
  }
  .input-wrap input:focus { border-color: var(--primary); }
  .input-wrap button {
    padding: 14px 22px; border: none; border-radius: var(--radius);
    background: var(--primary); color: #fff; font-size: 1rem;
    font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .input-wrap button:active { background: var(--primary-hover); }

  .filters {
    display: flex; gap: 4px; background: var(--card-bg);
    border-radius: var(--radius); padding: 4px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .filters button {
    flex: 1; padding: 11px 8px; border: none; border-radius: 9px;
    background: transparent; color: var(--text-secondary);
    font-size: .85rem; font-weight: 500; cursor: pointer; transition: all .2s;
  }
  .filters button.active { background: var(--primary); color: #fff; }

  .todo-list { display: flex; flex-direction: column; gap: 8px; }
  .empty { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
  .empty .icon { font-size: 3.5rem; margin-bottom: 12px; display: block; opacity: .7; }
  .empty .text { font-size: .95rem; }

  .todo-item {
    display: flex; align-items: center; gap: 12px;
    background: var(--card-bg); padding: 14px 16px; border-radius: var(--radius);
    box-shadow: 0 1px 3px rgba(0,0,0,.05);
    animation: fadeIn .25s ease; position: relative; overflow: hidden;
  }
  @keyframes fadeIn {
    from { opacity:0; transform: translateY(-6px); }
    to   { opacity:1; transform: translateY(0); }
  }
  .todo-item.completed .todo-text {
    text-decoration: line-through; color: var(--text-secondary);
  }

  .check-btn {
    flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%;
    border: 2px solid var(--border); background: transparent;
    cursor: pointer; display: flex; align-items: center;
    justify-content: center; transition: all .2s; padding: 0;
  }
  .check-btn.done { background: var(--success); border-color: var(--success); color: #fff; font-weight: 700; }

  .todo-text { flex: 1; font-size: 1rem; word-break: break-word; padding: 4px 0; }

  .action-btn {
    flex-shrink: 0; width: 36px; height: 36px; border-radius: 10px;
    border: none; background: transparent; font-size: 1.1rem;
    cursor: pointer; display: flex; align-items: center;
    justify-content: center; padding: 0;
  }
  .action-btn.edit-btn:active { background: #eef2ff; }
  .action-btn.del-btn:active { background: #fef2f2; }

  .footer { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; }
  .footer .items-left { color: var(--text-secondary); font-size: .8rem; }
  .footer .clear-btn {
    padding: 8px 14px; border: none; border-radius: 8px;
    background: transparent; color: var(--danger); font-size: .8rem;
    font-weight: 500; cursor: pointer;
  }
  .footer .clear-btn:disabled { opacity: .35; cursor: default; }

  .toast {
    position: fixed; bottom: 80px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #1a1a2e; color: #fff; padding: 10px 24px;
    border-radius: 20px; font-size: .85rem; opacity: 0;
    transition: all .3s; pointer-events: none; z-index: 999;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Editing */
  .todo-item.editing .todo-text { display: none; }
  .todo-item.editing .action-btn { display: none; }
  .edit-input {
    display: none; flex: 1; padding: 10px 12px;
    border: 2px solid var(--primary); border-radius: 10px;
    font-size: 1rem; outline: none; background: var(--card-bg);
    color: var(--text); -webkit-user-select: text; user-select: text;
  }
  .todo-item.editing .edit-input { display: block; }
  .todo-item.editing .check-btn { display: none; }
  .btn-save, .btn-cancel {
    display: none; padding: 10px 16px; border: none; border-radius: 10px;
    font-size: .85rem; font-weight: 500; cursor: pointer; white-space: nowrap;
  }
  .todo-item.editing .btn-save, .todo-item.editing .btn-cancel { display: inline-block; }
  .btn-save { background: var(--primary); color: #fff; }
  .btn-cancel { background: var(--bg); color: var(--text-secondary); }

  /* PWA Install Button */
  .install-fab {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--primary); color: #fff; border: none;
    border-radius: 50px; padding: 14px 22px; font-size: .95rem;
    font-weight: 600; cursor: pointer; box-shadow: 0 4px 16px rgba(79,70,229,.4);
    z-index: 998; display: none; align-items: center; gap: 6px;
  }
  .install-fab.show { display: flex; }

  @media (max-width: 480px) {
    .stats { flex-wrap: wrap; }
  }
</style>
</head>
<body>

<div class="topbar">
  <h1>📋 待办事项</h1>
  <span class="date" id="dateDisplay"></span>
</div>

<div class="main-scroll" id="mainScroll">
  <div class="app">
    <div class="stats">
      <div class="stat-card"><div class="num" id="countTotal">0</div><div class="label">全部</div></div>
      <div class="stat-card"><div class="num" id="countActive">0</div><div class="label">待完成</div></div>
      <div class="stat-card"><div class="num" id="countDone">0</div><div class="label">已完成</div></div>
    </div>

    <div class="input-wrap">
      <input type="text" id="todoInput" placeholder="添加新的待办事项…" maxlength="200" autocomplete="off" enterkeyhint="done">
      <button id="addBtn">➕ 添加</button>
    </div>

    <div class="filters">
      <button class="active" data-filter="all">全部</button>
      <button data-filter="active">待完成</button>
      <button data-filter="done">已完成</button>
    </div>

    <div class="todo-list" id="todoList"></div>

    <div class="footer">
      <span class="items-left" id="itemsLeft"></span>
      <button class="clear-btn" id="clearDone" disabled>🗑 清除已完成</button>
    </div>
  </div>
</div>

<!-- 浮动安装按钮 -->
<button class="install-fab" id="installFab">📲 安装到桌面</button>

<div class="toast" id="toast"></div>

<script>
(function () {
  // ============================================================
  // PWA SETUP — manifest + service worker via blob URLs
  // ============================================================

  // Generate manifest as blob (avoids file-loading issues)
  const manifest = {
    name: '待办事项',
    short_name: 'Todo',
    description: '简洁高效的待办事项管理工具',
    start_url: location.href.replace(location.search, ''),
    scope: location.origin + location.pathname.replace(/[^/]*$/, ''),
    display: 'standalone',
    orientation: 'portrait',
    background_color: '#4f46e5',
    theme_color: '#4f46e5',
    lang: 'zh-CN',
    icons: [{
      src: 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192"><rect width="192" height="192" rx="36" fill="#4f46e5"/><text x="96" y="74" text-anchor="middle" font-size="80">📋</text><text x="96" y="140" text-anchor="middle" font-size="36" font-weight="bold" fill="white">Todo</text></svg>'),
      sizes: '192x192',
      type: 'image/svg+xml',
      purpose: 'any maskable'
    }]
  };

  const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
  const manifestUrl = URL.createObjectURL(manifestBlob);
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = manifestUrl;
  document.head.appendChild(link);

  // Generate service worker as blob
  const swCode = `
const CACHE = 'todo-v3';
self.addEventListener('install', e => { self.skipWaiting(); });
self.addEventListener('activate', e => {
  e.waitUntil(caches.keys().then(ks => Promise.all(ks.filter(k => k !== CACHE).map(k => caches.delete(k)))));
  self.clients.claim();
});
self.addEventListener('fetch', e => {
  if (e.request.method !== 'GET') return;
  e.respondWith(
    caches.match(e.request).then(cached => {
      return cached || fetch(e.request).then(resp => {
        if (resp && resp.status === 200) {
          const clone = resp.clone();
          caches.open(CACHE).then(c => c.put(e.request, clone));
        }
        return resp;
      }).catch(() => caches.match(e.request));
    })
  );
});
`;

  const swBlob = new Blob([swCode], { type: 'application/javascript' });
  const swUrl = URL.createObjectURL(swBlob);

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register(swUrl).then(reg => {
      console.log('SW registered');
    }).catch(err => {
      console.log('SW failed:', err);
    });
  }

  // PWA Install handling
  let deferredPrompt = null;
  const installFab = document.getElementById('installFab');

  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredPrompt = e;
    installFab.classList.add('show');
  });

  installFab.addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const result = await deferredPrompt.userChoice;
    if (result.outcome === 'accepted') {
      installFab.classList.remove('show');
      deferredPrompt = null;
    }
  });

  window.addEventListener('appinstalled', () => {
    installFab.classList.remove('show');
    deferredPrompt = null;
  });

  // ============================================================
  // TODO APP LOGIC
  // ============================================================
  const STORAGE_KEY = 'todos_pwa_v3';
  let todos = [];
  let filter = 'all';
  let toastTimer;

  const $ = s => document.querySelector(s);
  const elInput = $('#todoInput');
  const elAddBtn = $('#addBtn');
  const elList = $('#todoList');
  const elDate = $('#dateDisplay');
  const elCountTotal = $('#countTotal');
  const elCountActive = $('#countActive');
  const elCountDone = $('#countDone');
  const elItemsLeft = $('#itemsLeft');
  const elClearDone = $('#clearDone');
  const elToast = $('#toast');
  const filterBtns = document.querySelectorAll('.filters button');

  function load() {
    try { todos = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch { todos = []; }
    if (!Array.isArray(todos)) todos = [];
  }
  function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(todos)); }

  function toast(msg) {
    clearTimeout(toastTimer);
    elToast.textContent = msg;
    elToast.classList.add('show');
    toastTimer = setTimeout(() => elToast.classList.remove('show'), 1800);
  }

  function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

  function getFiltered() {
    if (filter === 'active') return todos.filter(t => !t.done);
    if (filter === 'done') return todos.filter(t => t.done);
    return todos;
  }

  function updateStats() {
    const total = todos.length;
    const active = todos.filter(t => !t.done).length;
    const done = total - active;
    elCountTotal.textContent = total;
    elCountActive.textContent = active;
    elCountDone.textContent = done;
    elItemsLeft.textContent = active === 0 ? '全部完成 🎉' : active + ' 项待完成';
    elClearDone.disabled = done === 0;
  }

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function render() {
    const filtered = getFiltered();
    updateStats();

    if (filtered.length === 0) {
      const msgs = {
        all: { icon:'📝', text:'还没有待办事项，添加一个吧！' },
        active: { icon:'✅', text:'所有事项都已完成！' },
        done: { icon:'📋', text:'还没有已完成的事项' },
      };
      const m = msgs[filter];
      elList.innerHTML = '<div class="empty"><span class="icon">' + m.icon + '</span><span class="text">' + m.text + '</span></div>';
      return;
    }

    elList.innerHTML = filtered.map(t => {
      var cls = t.done ? 'todo-item completed' : 'todo-item';
      var checkCls = t.done ? 'check-btn done' : 'check-btn';
      return '<div class="' + cls + '" data-id="' + t.id + '">' +
        '<button class="' + checkCls + '" data-action="toggle">' + (t.done ? '✓' : '') + '</button>' +
        '<span class="todo-text">' + escapeHtml(t.text) + '</span>' +
        '<input class="edit-input" value="' + escapeHtml(t.text) + '" maxlength="200">' +
        '<button class="action-btn edit-btn" data-action="edit">✏️</button>' +
        '<button class="action-btn del-btn" data-action="delete">🗑</button>' +
        '<button class="btn-save" data-action="save">保存</button>' +
        '<button class="btn-cancel" data-action="cancel">取消</button>' +
        '</div>';
    }).join('');
  }

  function addTodo() {
    var text = elInput.value.trim();
    if (!text) { elInput.focus(); return; }
    todos.unshift({ id: genId(), text: text, done: false });
    save();
    elInput.value = '';
    elInput.focus();
    render();
    toast('已添加 ✓');
  }

  function toggleTodo(id) {
    var todo = todos.find(function(t) { return t.id === id; });
    if (todo) { todo.done = !todo.done; save(); render(); }
  }

  function deleteTodo(id) {
    todos = todos.filter(function(t) { return t.id !== id; });
    save();
    render();
    toast('已删除');
  }

  function clearDone() {
    var count = todos.filter(function(t) { return t.done; }).length;
    if (count === 0) return;
    todos = todos.filter(function(t) { return !t.done; });
    save();
    render();
    toast('已清除 ' + count + ' 项');
  }

  function startEdit(id) {
    var item = elList.querySelector('[data-id="' + id + '"]');
    if (!item) return;
    item.classList.add('editing');
    var inp = item.querySelector('.edit-input');
    inp.focus();
    inp.setSelectionRange(inp.value.length, inp.value.length);
  }

  function saveEdit(id) {
    var item = elList.querySelector('[data-id="' + id + '"]');
    if (!item) return;
    var inp = item.querySelector('.edit-input');
    var text = inp.value.trim();
    if (text) {
      var todo = todos.find(function(t) { return t.id === id; });
      if (todo) { todo.text = text; save(); }
    }
    render();
  }

  function cancelEdit() { render(); }

  function setFilter(f) {
    filter = f;
    filterBtns.forEach(function(b) { b.classList.toggle('active', b.dataset.filter === f); });
    render();
  }

  // Event delegation
  elList.addEventListener('click', function(e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    var item = e.target.closest('.todo-item');
    if (!item) return;
    var id = item.dataset.id;
    var action = btn.dataset.action;
    switch (action) {
      case 'toggle': toggleTodo(id); break;
      case 'edit': startEdit(id); break;
      case 'delete': deleteTodo(id); break;
      case 'save': saveEdit(id); break;
      case 'cancel': cancelEdit(); break;
    }
  });

  elList.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && e.target.classList.contains('edit-input')) {
      e.preventDefault();
      var item = e.target.closest('.todo-item');
      if (item) saveEdit(item.dataset.id);
    }
    if (e.key === 'Escape' && e.target.classList.contains('edit-input')) {
      cancelEdit();
    }
  });

  // Long press to edit
  var longPressTimer;
  elList.addEventListener('touchstart', function(e) {
    var textEl = e.target.closest('.todo-text');
    if (!textEl) return;
    var item = textEl.closest('.todo-item');
    if (!item || item.classList.contains('editing')) return;
    longPressTimer = setTimeout(function() {
      startEdit(item.dataset.id);
    }, 600);
  }, { passive: true });
  elList.addEventListener('touchend', function() { clearTimeout(longPressTimer); });
  elList.addEventListener('touchmove', function() { clearTimeout(longPressTimer); });

  elAddBtn.addEventListener('click', addTodo);
  elInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { e.preventDefault(); addTodo(); }
  });

  filterBtns.forEach(function(b) {
    b.addEventListener('click', function() { setFilter(b.dataset.filter); });
  });

  elClearDone.addEventListener('click', clearDone);

  function updateDate() {
    var now = new Date();
    var opts = { year:'numeric', month:'long', day:'numeric', weekday:'long' };
    elDate.textContent = now.toLocaleDateString('zh-CN', opts);
  }
  updateDate();

  load();
  render();
  elInput.focus();
})();
</script>
</body>
</html>
